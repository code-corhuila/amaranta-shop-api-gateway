# Resolve service names on EVERY request through Docker's embedded DNS, instead of once at startup (Annex F).
# With a static `upstream` block, one domain that is down when the gateway starts takes the whole entry point down
# with it. Resolving per request isolates the failure: that route answers 503 and every other route keeps working.
# Every route file therefore puts its target in a VARIABLE before `proxy_pass`.
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 2s;
