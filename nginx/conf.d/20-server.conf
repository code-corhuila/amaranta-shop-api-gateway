server {
    listen 8000;

    include /etc/nginx/snippets/headers.conf;

    # What every proxied request carries to the service. The Authorization header goes through untouched: the service
    # validates the token itself, the gateway never does (norm 5.3.7).
    proxy_set_header X-Correlation-Id $correlation_id;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Host $host;
    proxy_connect_timeout 2s;       # a service that does not accept in 2 s is down: fail fast, do not queue
    proxy_read_timeout 10s;

    # The rate limit (zone and key in 10-security.conf). nginx runs it AFTER the rewrite phase, where `return` lives:
    # a location that answers with a bare `return` is never counted. So the requests that are proxied, and the unknown
    # routes (see `location /` below), are limited; the 401 and the preflight, which cost the gateway almost nothing and
    # never reach a service, are not.
    limit_req zone=per_client burst=40 nodelay;

    # A browser's preflight carries no credential and asks only what is allowed: the CORS headers above are the answer.
    # It is answered here, before any route, so no route has to remember it.
    if ($request_method = OPTIONS) {
        return 204;
    }

    # The errors the gateway produces ITSELF answer with the shared envelope, like any service. The errors a service
    # returns pass through untouched: it already used the envelope.
    error_page 401 @unauthorized;
    error_page 404 @not_found;
    error_page 429 @too_many_requests;
    error_page 502 503 504 =503 @unavailable;

    include /etc/nginx/routes/*.conf;

    # Anything no route claimed. This is also why the /internal routes of the services are unreachable: no route file
    # names them, so there is nothing to reach. `try_files` runs after the rate limit (a bare `return` would not), so a
    # scanner walking unknown paths is limited too; the file it looks for never exists.
    location / {
        try_files /nothing-is-served-from-disk =404;
    }

    location @not_found {
        default_type application/json;
        return 404 '{"error":"NOT_FOUND","message":"no such route","traceId":"$correlation_id"}';
    }

    location @unauthorized {
        include /etc/nginx/snippets/headers.conf;
        add_header WWW-Authenticate Bearer always;
        default_type application/json;
        return 401 '{"error":"UNAUTHORIZED","message":"a credential is required","traceId":"$correlation_id"}';
    }

    location @too_many_requests {
        include /etc/nginx/snippets/headers.conf;
        add_header Retry-After 1 always;
        default_type application/json;
        return 429 '{"error":"TOO_MANY_REQUESTS","message":"slow down and retry","traceId":"$correlation_id"}';
    }

    location @unavailable {
        include /etc/nginx/snippets/headers.conf;
        default_type application/json;
        return 503 '{"error":"SERVICE_UNAVAILABLE","message":"the service is not available, retry later","traceId":"$correlation_id"}';
    }
}
