# The policy of the whole gateway: who may call from a browser, and how a request is traced. The route files only USE
# these variables; none of them decides a policy of its own.

# CORS: only the front-end origins (the shell and its portals). Never '*' together with credentials. An origin that is
# not listed gets an empty value, so no Access-Control-Allow-Origin is sent for it.
map $http_origin $cors_origin {
    default                     "";
    "http://localhost:3000"     $http_origin;    # the web of the monolith, still served while the move is made
    "http://localhost:4200"     $http_origin;    # the Angular shell
    "http://localhost:5173"     $http_origin;    # a React portal in development
}

# Correlation: reuse the X-Correlation-Id the client sent, or create one. It goes to the service, back to the client and
# into every access-log line. Only a plain id is reused (letters, digits, dot, dash, underscore, up to 128): anything
# else is replaced, so a client cannot put markup, newlines or a kilobyte of text into logs and error bodies.
map $http_x_correlation_id $correlation_id {
    default                              $request_id;
    "~^[A-Za-z0-9._-]{1,128}$"           $http_x_correlation_id;
}

# W3C trace context: accept only a non-zero version-00 trace and parent span. The gateway keeps the trace id but creates
# one span for its response and another for the request it forwards upstream. When a browser starts no trace, nginx's
# request id supplies the 32 hex characters needed for the root trace id.
map $http_traceparent $incoming_trace_id {
    default "";
    "~^00-(?!0{32}-)(?<incoming_trace_id_value>[0-9a-f]{32})-(?!0{16}-)[0-9a-f]{16}-[0-9a-f]{2}$" $incoming_trace_id_value;
}
map $http_traceparent $trace_flags {
    default "01";
    "~^00-(?!0{32}-)[0-9a-f]{32}-(?!0{16}-)[0-9a-f]{16}-(?<incoming_trace_flags>[0-9a-f]{2})$" $incoming_trace_flags;
}
map $incoming_trace_id $trace_id {
    default $incoming_trace_id;
    ""      $request_id;
}
map $request_id $gateway_server_span_id {
    "~^(?<gateway_server_span_value>[0-9a-f]{16})[0-9a-f]{16}$" $gateway_server_span_value;
}
map $request_id $gateway_upstream_span_id {
    "~^[0-9a-f]{16}(?<gateway_upstream_span_value>[0-9a-f]{16})$" $gateway_upstream_span_value;
}

# Rate limit: one bucket per client address, 100 requests a minute, with a burst of 40 (set in 20-server.conf). The 429
# it produces uses the shared envelope. nginx does not count a request whose key is EMPTY, which is how the health
# probe of an orchestrator is left out without a route file having to know about the limit.
map $uri $rate_key {
    "/health"   "";
    default     $binary_remote_addr;
}
limit_req_zone $rate_key zone=per_client:10m rate=100r/m;
limit_req_status 429;

# The cheap credential filter: 1 when the request carries no Authorization header at all. It never looks INSIDE the
# header: the signature, the expiry and the claims are checked by each service, never only here (Annex F, norm 5.3.7).
map $http_authorization $credential_missing {
    default     0;
    ""          1;
}
