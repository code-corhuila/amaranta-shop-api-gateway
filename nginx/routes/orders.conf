# Orders -> sales-api. The name goes in a VARIABLE so nginx resolves it on every request (00-resolver.conf): with this
# service down, only these routes answer 503.

# Placing an order is open: a visitor buys with no account. The service still validates a token when one is present, and
# answers 401 itself if it is broken. Listing "my orders" is not open: it needs a credential.
location = /api/v1/orders {
    set $sales_api http://sales-api:8080;
    set $credential_required $credential_missing;
    if ($request_method = POST) {
        set $credential_required 0;
    }
    if ($credential_required) {
        return 401;
    }
    proxy_pass $sales_api;
}

# Everything below /orders (in-store order, mark as paid, ...) needs a credential; the service decides the role.
location ^~ /api/v1/orders/ {
    set $sales_api http://sales-api:8080;
    include /etc/nginx/snippets/require-credential.conf;
    proxy_pass $sales_api;
}
