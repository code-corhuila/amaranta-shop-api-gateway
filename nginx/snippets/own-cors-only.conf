# For a service that sets CORS headers of its own (the monolith does, for its own web): drop them, so the browser sees only the
# gateway's policy (conf.d/10-security.conf). Two Access-Control-Allow-Origin values make a browser refuse the answer.
proxy_hide_header Access-Control-Allow-Origin;
proxy_hide_header Access-Control-Allow-Credentials;
proxy_hide_header Access-Control-Expose-Headers;
