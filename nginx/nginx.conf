# Global settings only. Everything else lives in conf.d/ (the policy of the whole gateway), snippets/ (the pieces that
# are repeated) and routes/ (one file per domain). This file changes almost never.
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # One JSON object per request, with the correlation id (norm 5.3.9). Never the body and never the token.
    log_format json escape=json '{"time":"$time_iso8601","correlationId":"$correlation_id","traceId":"$trace_id","spanId":"$gateway_server_span_id",'
        '"method":"$request_method","uri":"$uri","status":$status,'
        '"upstream":"$upstream_addr","durationMs":$request_time}';
    access_log /dev/stdout json;
    error_log  /dev/stderr warn;

    server_tokens off;          # the server does not say which nginx it is
    client_max_body_size 2m;    # a JSON checkout is a few kilobytes; nothing here uploads files

    include /etc/nginx/conf.d/*.conf;
}
