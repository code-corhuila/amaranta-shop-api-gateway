# Sign in and create an account -> identity. The name goes in a VARIABLE so nginx resolves it on every request
# (00-resolver.conf): with this service down, only these routes answer 503.
#
# Today `identity` is answered by the monolith, which still owns accounts (ADR-011, point 9); when the security service is
# extracted, only the network alias changes, not this file nor any client. The monolith serves these two at /auth/..., so the
# public path is mapped to it here, the way the other domains map theirs.
#
# Only the two public operations are named. The rest of what the monolith offers under /auth (walk-in registration, the list
# of staff, the search of customers) is not named, so the gateway has nothing to route and it answers 404.
# Neither needs a credential (nobody has one yet). Both are POST only and have a tighter limit than the rest of the gateway,
# because they are the doors a password-guessing script would knock on.

location = /api/v1/auth/login {
    set $identity_api http://identity:8080;
    limit_req zone=auth_per_client burst=10 nodelay;
    if ($request_method != POST) {
        return 404;
    }
    include /etc/nginx/snippets/own-cors-only.conf;
    proxy_pass $identity_api/auth/login;
}

location = /api/v1/auth/register {
    set $identity_api http://identity:8080;
    limit_req zone=auth_per_client burst=10 nodelay;
    if ($request_method != POST) {
        return 404;
    }
    include /etc/nginx/snippets/own-cors-only.conf;
    proxy_pass $identity_api/auth/register;
}
