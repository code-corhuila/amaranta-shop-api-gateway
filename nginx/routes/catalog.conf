# Products -> catalog-api. The name goes in a VARIABLE so nginx resolves it on every request (00-resolver.conf): with this
# service down, only these routes answer 503.
#
# Only the two public paths and the admin paths are named here. The service also has /internal/products/* (reserve and
# release stock, for sales-api): nothing below names them, so the gateway has nothing to route and they answer 404.
# Every location is an exact path or a prefix that ends in "/", so /api/v1/productsx matches none of them.

# Browsing needs no account: the catalog and a single product are public, with no credential.
location = /api/v1/products {
    set $catalog_api http://catalog-api:8082;
    proxy_pass $catalog_api;
}

location ^~ /api/v1/products/ {
    set $catalog_api http://catalog-api:8082;
    proxy_pass $catalog_api;
}

# Managing the catalog needs a credential; the service decides that it is an ADMIN.
location = /api/v1/admin/products {
    set $catalog_api http://catalog-api:8082;
    include /etc/nginx/snippets/require-credential.conf;
    proxy_pass $catalog_api;
}

location ^~ /api/v1/admin/products/ {
    set $catalog_api http://catalog-api:8082;
    include /etc/nginx/snippets/require-credential.conf;
    proxy_pass $catalog_api;
}
