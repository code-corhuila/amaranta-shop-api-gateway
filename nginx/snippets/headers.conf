# Headers every response carries. nginx drops the add_header of an outer level as soon as a location declares its own,
# so every location that adds a header includes THIS file instead of repeating the list (Annex F).
add_header X-Correlation-Id $correlation_id always;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Access-Control-Allow-Origin $cors_origin always;
add_header Access-Control-Allow-Headers "Authorization, Content-Type, Idempotency-Key, X-Correlation-Id" always;
add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
add_header Access-Control-Expose-Headers "X-Correlation-Id, Location" always;
add_header Vary Origin always;
