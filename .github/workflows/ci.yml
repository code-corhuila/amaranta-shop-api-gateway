name: CI

# Every pull request builds the gateway and runs every check it must pass on a clean machine.
# "It works on my computer" is not evidence; a green check here is.

on:
  pull_request:
    branches: [develop, qa, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  base:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: The repository has its minimum content
        run: |
          for file in README.md .github/CODEOWNERS .gitignore .env.example deploy/Dockerfile deploy/compose.yml nginx/nginx.conf; do
            [ -f "$file" ] || { echo "missing $file"; exit 1; }
          done

      - name: No real environment file or key is versioned
        run: |
          if git ls-files | grep -E '(^|/)\.env$|\.pem$|(^|/)keys/'; then
            echo "A real environment file or key is versioned"
            exit 1
          fi

      - name: The gateway holds no business rule, no secret and no state (Annex F)
        run: |
          if grep -rniE 'jwt|secret|password|BEGIN (RSA|PUBLIC)' nginx/ ; then
            echo "the gateway only checks that a credential exists: it never validates or stores one"
            exit 1
          fi

  config-and-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # scripts/test.sh builds the image, runs `nginx -t`, then tests/smoke.sh and tests/routing.sh against it.
      - name: Every check the gateway must pass
        run: bash scripts/test.sh
