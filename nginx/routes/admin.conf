# The back office of the shop: what only the administrator may read. Each location is an exact path (never a prefix), so
# nothing else under /api/v1/admin is routed from here. The gateway only checks that a credential EXISTS; the service
# that owns the data checks that it is an administrator's and answers 403 otherwise (norm 5.3.7). The names go in
# VARIABLES so nginx resolves them on every request (00-resolver.conf): with one service down, only its route answers 503.
# The administration of the catalog (/api/v1/admin/products) lives in catalog.conf, with the rest of that domain.

# Every order of the shop, newest first, one page at a time -> sales-api.
location = /api/v1/admin/orders {
    set $sales_api http://sales-api:8080;
    include /etc/nginx/snippets/require-credential.conf;
    proxy_pass $sales_api;
}

# Every registered account, newest first, one page at a time -> identity (answered by the monolith until the security
# service exists, ADR-011 point 9), which serves it at /auth/users. The monolith sets CORS headers of its own: dropped.
location = /api/v1/admin/users {
    set $identity_api http://identity:8080;
    include /etc/nginx/snippets/require-credential.conf;
    include /etc/nginx/snippets/own-cors-only.conf;
    proxy_pass $identity_api/auth/users$is_args$args;
}
