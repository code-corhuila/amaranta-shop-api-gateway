# Sagas -> workflow. The name goes in a VARIABLE so nginx resolves it on every request (00-resolver.conf): with the
# workflow down, only these routes answer 503.
#
# Starting a saga (POST /api/v1/sagas/place-order) and reading one (GET /api/v1/sagas/{id}) both need a credential
# (Annex E): the gateway only checks that one exists, the workflow validates it. The workflow then calls the domains with
# its own service token, never with the person's. The bare /api/v1/sagas and /api/v1/sagasx match nothing here.
#
# The workflow answers on 8083, following sales (8080) and catalog (8082). The port is written in this one place.

# Without this, nginx answers the bare /api/v1/sagas with a 301 to the prefix below. There is nothing at that path, so it
# is the gateway's own 404 (try_files runs after the rate limit, as in 20-server.conf).
location = /api/v1/sagas {
    try_files /nothing-is-served-from-disk =404;
}

location ^~ /api/v1/sagas/ {
    set $workflow_api http://workflow:8083;
    include /etc/nginx/snippets/require-credential.conf;
    proxy_pass $workflow_api;
}
